# Keeps this repository's `main` in step with the project it was copied from.
#
# GitHub does not record this repository as a fork (one fork per account per network, and that slot is taken),
# so it never offers a "Sync fork" button. This approximates one: daily, merge `upstream/main` into `main` and
# push the result here. Merge commits only, so commits made here are never rewritten; a conflict stops the job
# before anything is pushed and keeps a single open issue about it.
#
# Fork-local: do not open a pull request with this file against the upstream repository.
name: Upstream sync

on:
  schedule:
    - cron: '17 4 * * *' # daily; GitHub delays scheduled runs at busy times
  workflow_dispatch:

# A push made with the built-in token does not start workflows, so the sync dispatches CI itself (see the
# last step). Add a repository secret `UPSTREAM_SYNC_TOKEN` (a fine-grained PAT with `contents: write`) and the
# push triggers CI normally instead; the secret is optional.
permissions:
  contents: write # push the merge commit
  issues: write # report a conflict
  actions: write # dispatch CI after a built-in-token push

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: emmertex/lightcraft-classic
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0 # a merge needs the common history
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream "${TARGET_BRANCH}"
          git fetch --tags upstream

          if git merge-base --is-ancestor "upstream/${TARGET_BRANCH}" HEAD; then
            echo "already up to date"
            echo "result=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit "upstream/${TARGET_BRANCH}"; then
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "::warning::upstream has changes that conflict with ${TARGET_BRANCH}; nothing was pushed"
            exit 0
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
          # Tags make the upstream releases visible here; a tag the upstream moved needs a force, which is
          # not worth failing the day's merge over.
          git push --tags origin || echo "::warning::could not push tags"
          echo "result=merged" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI for a built-in-token push
        if: steps.merge.outputs.result == 'merged' && env.SYNC_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "${TARGET_BRANCH}" \
            || echo "::warning::the merge landed but CI was not dispatched"

      - name: Report a conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ env.TARGET_BRANCH }}
          UP: ${{ env.UPSTREAM }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          \`${UP}\` has changes that conflict with \`${BRANCH}\`, so nothing was pushed.

          Resolve it locally and push; the next scheduled run carries on from there:

          \`\`\`sh
          git fetch upstream
          git merge upstream/${BRANCH} # resolve, commit
          git push origin ${BRANCH}
          \`\`\`

          Posted by the upstream-sync workflow.
          EOF
          )
          existing=$(gh issue list --state open --search '"Upstream sync blocked" in:title' \
            --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Upstream sync blocked: manual merge needed" --body "$body"
          fi
